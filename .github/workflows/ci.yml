name: CI

on:
  push:
    branches: ["**"]
    # tag 必须写在这里：只定义 branches 时，tag 推送不会触发工作流，
    # 下面那个 startsWith(github.ref, 'refs/tags/v') 的 release job 就永远是死代码。
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（留空 = v<manifest 里的 version>）"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 不能用 20：jsdom 30 要求 ^22.22.2 || ^24.15.0 || >=26。
          # 在 Node 20 上它内嵌的 undici 会直接崩（webidl.util.markAsUncloneable
          # is not a function），所有测试文件一起 testCodeFailure。
          # 必须钉到满足引擎要求的版本，"22" 解析出来的可能仍低于 22.22.2。
          node-version: "22.22.2"

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 打印环境
        run: node -v && npm -v

      - name: 静态自检（语法 / manifest / 读音词典 / 密钥）
        run: npm run check

      - name: 单元测试
        run: npm test

      - name: 打包 .plugin
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: western-katakana-plugin
          path: builds/*.plugin
          if-no-files-found: error

  release:
    # 打 tag 时自动发 Release，产物可以直接丢进 BetterNCM 插件目录。
    # 手动跑（Actions → Run workflow）也能发：不给 tag 就用 manifest 里的 version。
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 和 test job 保持一致，理由见上
          node-version: "22.22.2"

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 打包
        run: npm run build

      - name: 定 tag 与版本号
        id: meta
        run: |
          version="$(node -p "require('./src/manifest.json').version")"
          tag=""
          # tag 推送：用推上来的那个 tag（别拿 manifest 的版本另造一个）
          case "$GITHUB_REF" in refs/tags/v*) tag="${GITHUB_REF#refs/tags/}";; esac
          # 手动跑：优先用输入框里的 tag，空着就用 manifest 的版本 -> v<version>
          if [ -z "$tag" ]; then tag="${{ github.event.inputs.tag }}"; fi
          if [ -z "$tag" ]; then tag="v$version"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "发布 $tag（版本 $version）"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: builds/*.plugin
          name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true
