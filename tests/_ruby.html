<!doctype html>
<html><head><meta charset="utf-8"><style>
body { background:#5b4a66; color:#fff; font-family:"Yu Gothic"; font-size:44px; padding:30px; }
ruby.wk-ruby { ruby-position: over; -webkit-ruby-position: before; ruby-align: center; white-space: nowrap; }
rt.wk-rt { font-size:60%; opacity:.9; font-weight:normal; letter-spacing:0; line-height:0; text-align:center; white-space:nowrap; }
/* B 方案：把 ruby 变成 inline-flex 竖排，盒子宽度 = 注音宽度，不会和隔壁重叠 */
.flex ruby.wk-ruby { display: inline-flex; flex-direction: column; align-items: center; vertical-align: bottom; }
.flex rt.wk-rt { line-height: 1.1; }
</style></head><body>
<div class="a">無<ruby class="wk-ruby">能<rt class="wk-rt">むのう</rt></ruby> 無<ruby class="wk-ruby">能<rt class="wk-rt">むのう</rt></ruby> 無<ruby class="wk-ruby">能<rt class="wk-rt">むのう</rt></ruby></div>
<div class="flex">無<ruby class="wk-ruby">能<rt class="wk-rt">むのう</rt></ruby> 無<ruby class="wk-ruby">能<rt class="wk-rt">むのう</rt></ruby> 無<ruby class="wk-ruby">能<rt class="wk-rt">むのう</rt></ruby></div>
</body></html>
